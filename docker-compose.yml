services:
  app:
    build: { context: ., dockerfile: docker/php.Dockerfile }
    volumes: [".:/var/www/html"]
    depends_on: [db, redis]
  web:
    image: nginx:alpine
    ports: ["8088:80"]
    volumes:
      - ".:/var/www/html"
      - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on: [app]
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: vpn
      MYSQL_ROOT_PASSWORD: root
    volumes: ["dbdata:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
volumes:
  dbdata: {}
