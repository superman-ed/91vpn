services:
  app:
    user: "1003:1003"
    build: { context: ., dockerfile: docker/php.Dockerfile }
    volumes: [".:/var/www/html"]
    depends_on: [db, redis]
  scheduler:
    user: "1003:1003"
    build: { context: ., dockerfile: docker/php.Dockerfile }
    volumes: [".:/var/www/html"]
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on: [db, redis]
  web:
    image: nginx:alpine
    # [L-03] 访问日志走 docker 的 json-file 驱动,而 LogConfig.Config 是空的 ——
    # 也就是【不轮转】。历史上这条日志里每行都带节点密钥,曾涨到取样 5 万行中
    # 47,118 行含明文;密钥现已在 nginx 侧遮蔽(见 docker/nginx.conf),
    # 但日志本身无上限这件事要单独治:磁盘满了会让整台机器一起出事。
    #
    # `[!]` 改这里要【重建容器】才生效(docker compose up -d web),
    # 光 restart 不行 —— LogConfig 是创建时定的。
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    # [!!] 两个口都【只绑回环】——对外一律经 Cloudflare Tunnel。
    # cloudflared 跑在本 compose 网内,用服务名直接到 web:80 / web:8080,
    # 根本不需要宿主机端口映射。
    #
    # 原来 8088 绑的是 0.0.0.0,实测【在 IPv6 上对外可连】:
    # 直接 http://[<本机IPv6>]:8088/login 就能打开面板,绕过 Cloudflare
    # (/admin 有 nginx 与 AdminHost 两道挡着没漏,但用户面和 mod_mu 是敞的)。
    # 源站 IP 暴露对一个订阅服务是实打实的风险 —— 它是用户客户端天天要拉的
    # 那个域名背后的机器,而这台机上还跑着别的东西。
    #
    # 18088 保留:出了隧道故障时,ssh -L 18088:127.0.0.1:18088 <server> 仍能进后台。
    ports: ["127.0.0.1:8088:80", "127.0.0.1:18088:8080"]
    volumes:
      - ".:/var/www/html"
      - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on: [app]
  # 后台隧道(ADR-008 / P0)。token 模式:域名/路由/Access 全在 CF 面板配,这里只跑。
  # cloudflared 在本 compose 网内,面板里 service 指 http://web:8080(仅回环的后台口)。
  # [!] 光有隧道≠安全:必须在 CF 面板给这个 hostname 加 Access 身份门,否则等于把后台放公网。
  # token 留空则该服务起不来 —— 不影响其余服务;填好 .env 再 `docker compose up -d cloudflared`。
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on: [web]
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: vpn
      MYSQL_ROOT_PASSWORD: root
    volumes: ["dbdata:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
volumes:
  dbdata: {}
