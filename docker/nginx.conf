# [L-03] 访问日志里【不能出现节点密钥】。
#
# nginx 默认的 combined 格式记的是 $request,它带完整 query ——
# 而节点鉴权历史上走 ?key=<密钥>,于是密钥被逐条记进访问日志。
# 实测取样 50,000 行里 47,118 行含明文密钥,而这把钥匙能换来该节点
# 【全部用户的 uuid 与连接密码】,还有 REALITY 私钥。
#
# agent 已经可以改走 X-Node-Secret 请求头(webapi_auth=header),
# 但那要逐台升级;在那之前、以及任何别的客户端仍用 ?key= 时,
# 这里兜住 —— 只要 query 里出现 key=,整个 query 就换成一个标记。
#
# `[!]` 只在命中 key= 时替换,不是一律砍掉 query:
# ?flag=clash 这类参数对排查有用,没必要一起丢。
# `[!]` 标记用 ASCII。写中文的话 nginx 会把非 ASCII 逐字节转义成
# \xE5\x90\xAB... —— 日志里认得出来,但 grep 不到,也就没法拿它做告警。
#
# `[!!]` 正则写法上踩过一次:最初写成 `\?.*(^|&|\?)key=`,
# 它要求 key= 前面有个分隔符 —— 而 key 是【第一个参数】时,
# 前面那个 `?` 已经被 `\?` 吃掉了,于是恰恰是最常见的 ?key=... 匹配不上。
# 改完必须拿真请求验一遍,不能只看 nginx -t 通过。
map $request_uri $safe_uri {
    "~^(?<qpath>[^?]*)\?(?:.*&)?key="  "${qpath}?key=REDACTED";
    default                             $request_uri;
}
# `[!!]` 必须记 CF-Connecting-IP：站点走 Cloudflare 隧道，$remote_addr 是
# cloudflared 容器的内网地址（172.21.0.x），对每一条请求都一样 ——
# 于是"这个请求是谁发的"在日志里【根本查不出来】。
# `[D]` 实际卡住过：某处有个配置成已删除节点 59 的 agent 在持续轮询并带着
# 旧密钥，而日志无法定位它在哪台机器上。
# `[!]` 没有这个头时 nginx 记 "-"，不影响其它字段。
log_format redacted '$remote_addr cf=$http_cf_connecting_ip - $remote_user [$time_local] '
                    '"$request_method $safe_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# [ADR-008 / P0] 后台网络隔离
# 公网口(:80 → 宿主 8088)把 /admin 一律 404:后台够不到。
# 后台口(:8080 → 宿主 127.0.0.1:18088,仅回环)才放行 /admin。
# 运维进后台:ssh -L 18088:127.0.0.1:18088 <server> 后开 http://localhost:18088/admin
#
# [!] 两个 server 块的静态/PHP 处理**刻意重复**一份 —— nginx 的 conf.d 里
# 只能放 server 级内容,抽成 location 片段要额外挂载文件、反而更绕。这几行很稳定,
# 重复的代价小于多一个挂载点。改动时记得两块一起改。

# ---------- 公网:客户端 API / 落地 mod_mu / 公开页,但没有后台 ----------
server {
    listen 80;
    access_log /var/log/nginx/access.log redacted;
    root /var/www/html/public;
    index index.php index.html;
    absolute_redirect off;   # 代理(CF Tunnel)后:发相对 Location,别把内部 :8080/http 泄进跳转

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-woff
               application/vnd.ms-fontobject;

    # [P0] 后台在公网一律 404(不暴露其存在)。含 /admin 与 /admin/*。
    location ^~ /admin { return 404; }

    location ^~ /stisla/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# ---------- 回环:管理后台【专用入口】(仅 127.0.0.1 发布,走 CF Tunnel / SSH 隧道) ----------
# [!] 这个域名只放后台:放行 /login /logout /admin + 后台静态;根与 /user 引到 /admin;
#     其余(用户面板 /user 内容、/api 等)一律 404。用户面板走它自己的公网子域名。
server {
    listen 8080;
    access_log /var/log/nginx/access.log redacted;
    root /var/www/html/public;
    index index.php index.html;
    absolute_redirect off;   # 代理(CF Tunnel)后:发相对 Location,别把内部 :8080/http 泄进跳转

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-woff
               application/vnd.ms-fontobject;

    # 后台 UI 要的静态资源
    location ^~ /stisla/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # 根 / 和用户面 /user 都引到后台:管理员默认落点是 /user,在本域名要拨回 /admin。
    location = /     { return 302 /admin; }
    location ^~ /user { return 302 /admin; }

    # 放行:登录 / 登出 / 后台(都经 index.php 路由)
    location = /login  { try_files $uri /index.php?$query_string; }
    location = /logout { try_files $uri /index.php?$query_string; }
    location ^~ /admin { try_files $uri $uri/ /index.php?$query_string; }

    # index.php 执行(仅上面几处会内部跳到它)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 其余路径(用户面板内容 / 客户端 API 等)在后台域名一律 404
    location / { return 404; }
}
