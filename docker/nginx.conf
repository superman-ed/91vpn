# [ADR-008 / P0] 后台网络隔离
# 公网口(:80 → 宿主 8088)把 /admin 一律 404:后台够不到。
# 后台口(:8080 → 宿主 127.0.0.1:18088,仅回环)才放行 /admin。
# 运维进后台:ssh -L 18088:127.0.0.1:18088 <server> 后开 http://localhost:18088/admin
#
# [!] 两个 server 块的静态/PHP 处理**刻意重复**一份 —— nginx 的 conf.d 里
# 只能放 server 级内容,抽成 location 片段要额外挂载文件、反而更绕。这几行很稳定,
# 重复的代价小于多一个挂载点。改动时记得两块一起改。

# ---------- 公网:客户端 API / 落地 mod_mu / 公开页,但没有后台 ----------
server {
    listen 80;
    root /var/www/html/public;
    index index.php index.html;
    absolute_redirect off;   # 代理(CF Tunnel)后:发相对 Location,别把内部 :8080/http 泄进跳转

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-woff
               application/vnd.ms-fontobject;

    # [P0] 后台在公网一律 404(不暴露其存在)。含 /admin 与 /admin/*。
    location ^~ /admin { return 404; }

    location ^~ /stisla/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# ---------- 回环:管理后台【专用入口】(仅 127.0.0.1 发布,走 CF Tunnel / SSH 隧道) ----------
# [!] 这个域名只放后台:放行 /login /logout /admin + 后台静态;根与 /user 引到 /admin;
#     其余(用户面板 /user 内容、/api 等)一律 404。用户面板走它自己的公网子域名。
server {
    listen 8080;
    root /var/www/html/public;
    index index.php index.html;
    absolute_redirect off;   # 代理(CF Tunnel)后:发相对 Location,别把内部 :8080/http 泄进跳转

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-woff
               application/vnd.ms-fontobject;

    # 后台 UI 要的静态资源
    location ^~ /stisla/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # 根 / 和用户面 /user 都引到后台:管理员默认落点是 /user,在本域名要拨回 /admin。
    location = /     { return 302 /admin; }
    location ^~ /user { return 302 /admin; }

    # 放行:登录 / 登出 / 后台(都经 index.php 路由)
    location = /login  { try_files $uri /index.php?$query_string; }
    location = /logout { try_files $uri /index.php?$query_string; }
    location ^~ /admin { try_files $uri $uri/ /index.php?$query_string; }

    # index.php 执行(仅上面几处会内部跳到它)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 其余路径(用户面板内容 / 客户端 API 等)在后台域名一律 404
    location / { return 404; }
}
