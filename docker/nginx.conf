# [ADR-008 / P0] 后台网络隔离
# 公网口(:80 → 宿主 8088)把 /admin 一律 404:后台够不到。
# 后台口(:8080 → 宿主 127.0.0.1:18088,仅回环)才放行 /admin。
# 运维进后台:ssh -L 18088:127.0.0.1:18088 <server> 后开 http://localhost:18088/admin
#
# [!] 两个 server 块的静态/PHP 处理**刻意重复**一份 —— nginx 的 conf.d 里
# 只能放 server 级内容,抽成 location 片段要额外挂载文件、反而更绕。这几行很稳定,
# 重复的代价小于多一个挂载点。改动时记得两块一起改。

# ---------- 公网:客户端 API / 落地 mod_mu / 公开页,但没有后台 ----------
server {
    listen 80;
    root /var/www/html/public;
    index index.php index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-woff
               application/vnd.ms-fontobject;

    # [P0] 后台在公网一律 404(不暴露其存在)。含 /admin 与 /admin/*。
    location ^~ /admin { return 404; }

    location ^~ /stisla/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# ---------- 回环:管理后台(仅 127.0.0.1 发布,走 SSH 隧道) ----------
server {
    listen 8080;
    root /var/www/html/public;
    index index.php index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-woff
               application/vnd.ms-fontobject;

    location ^~ /stisla/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
